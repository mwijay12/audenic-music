<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Audenic architecture">

 <defs>
  <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8b3bff"/><stop offset="45%" stop-color="#ff61c7"/><stop offset="100%" stop-color="#3b6bff"/>
    <animate attributeName="x1" values="0%;-60%;0%" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;160%;100%" dur="9s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="lime" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#8b3bff"/><stop offset="55%" stop-color="#ff61c7"/><stop offset="100%" stop-color="#c8f249"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0%" stop-color="#ff61c7" stop-opacity=".35"/><stop offset="100%" stop-color="#ff61c7" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop offset="0%" stop-color="#3b6bff" stop-opacity=".30"/><stop offset="100%" stop-color="#3b6bff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6377"/></marker>
