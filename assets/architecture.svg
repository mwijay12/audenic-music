 <rect x="36" y="74" width="336" height="116" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="36" y="74" width="4.5" height="116" rx="2" fill="#c8f249" stroke="none" stroke-width="1.2" opacity="1"/><text x="56" y="104" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">UI WORKSPACE</text><text x="56" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">React 19 + TypeScript + Vite</text><text x="56" y="144" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">25 screens: Home, Explore, My Music,</text><text x="56" y="162" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">Now Playing, Equalizer, DJ Mixer, Reels,</text><text x="56" y="180" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">Video Library, AI, Profile, Admin</text><circle cx="354" cy="96" r="4" fill="#c8f249"><animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/></circle><rect x="36" y="210" width="336" height="104" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="36" y="210" width="4.5" height="104" rx="2" fill="#ff61c7" stroke="none" stroke-width="1.2" opacity="1"/><text x="56" y="240" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">PLAYBACK STATE</text><text x="56" y="262" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">PlayerContext + useNativePlayback</text><text x="56" y="280" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">+ useMediaSession</text><text x="56" y="298" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">queue, shuffle, repeat, seek, progress,</text><text x="56" y="316" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">likes and sleep timer</text><circle cx="354" cy="232" r="4" fill="#ff61c7"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle><rect x="36" y="334" width="336" height="120" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="36" y="334" width="4.5" height="120" rx="2" fill="#8b3bff" stroke="none" stroke-width="1.2" opacity="1"/><text x="56" y="364" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">WEB AUDIO DSP</text><text x="56" y="386" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">AudioEngine: 5-band EQ, bass shelving,</text><text x="56" y="404" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">loudness normaliser, analyser</text><text x="56" y="422" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">AudioEffectsRack: reverb, delay, drive,</text><text x="56" y="440" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">filter sweep, EQ kills, automix</text><circle cx="354" cy="356" r="4" fill="#8b3bff"><animate attributeName="opacity" values="1;.15;1" dur="2.7s" repeatCount="indefinite"/></circle><rect x="432" y="208" width="300" height="150" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="432" y="208" width="4.5" height="150" rx="2" fill="#3b6bff" stroke="none" stroke-width="1.2" opacity="1"/><text x="452" y="238" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">BRIDGE</text><text x="452" y="260" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">Capacitor 6 native plugin</text><text x="452" y="278" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">nativeBridge.ts -> AudenicMedia</text><text x="452" y="296" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">12 methods: play, pause, next, prev,</text><text x="452" y="314" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">seek, loadQueue, updatePosition,</text><text x="452" y="332" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">setEqualizer, setReverb</text><circle cx="714" cy="230" r="4" fill="#3b6bff"><animate attributeName="opacity" values="1;.15;1" dur="1.9s" repeatCount="indefinite"/></circle><rect x="792" y="74" width="372" height="148" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="792" y="74" width="4.5" height="148" rx="2" fill="#c8f249" stroke="none" stroke-width="1.2" opacity="1"/><text x="812" y="104" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">NATIVE ANDROID</text><text x="812" y="126" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">ExoPlayer (media3 1.3.1) + MediaSessionCompat</text><text x="812" y="144" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">AudenicPlaybackService: foreground service</text><text x="812" y="162" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">with PARTIAL_WAKE_LOCK for screen-off play</text><text x="812" y="180" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">audiofx chain: Equalizer, BassBoost and</text><text x="812" y="198" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">PresetReverb routed via AuxEffectInfo send</text><circle cx="1146" cy="96" r="4" fill="#c8f249"><animate attributeName="opacity" values="1;.15;1" dur="2.4s" repeatCount="indefinite"/></circle><rect x="792" y="246" width="372" height="100" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="792" y="246" width="4.5" height="100" rx="2" fill="#ff61c7" stroke="none" stroke-width="1.2" opacity="1"/><text x="812" y="276" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">SYSTEM CONTROLS</text><text x="812" y="298" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">notification, lock screen, headset and</text><text x="812" y="316" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">Bluetooth media-button actions</text><text x="812" y="334" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">compileSdk 36, targetSdk 36, minSdk 26</text><circle cx="1146" cy="268" r="4" fill="#ff61c7"><animate attributeName="opacity" values="1;.15;1" dur="3.4s" repeatCount="indefinite"/></circle><rect x="792" y="370" width="372" height="110" rx="14" fill="#111117" stroke="#2a2a37" stroke-width="1.2" opacity="1"/><rect x="792" y="370" width="4.5" height="110" rx="2" fill="#8b3bff" stroke="none" stroke-width="1.2" opacity="1"/><text x="812" y="400" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15.5" font-weight="750" fill="#f2f3f8" text-anchor="start" letter-spacing="0.3" opacity="1">TAURI v2 DESKTOP</text><text x="812" y="422" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">Windows and Linux shell, frameless window</text><text x="812" y="440" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">global shortcuts, floating mini PIP</text><text x="812" y="458" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">same Web Audio graph, never muted</text><text x="812" y="476" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="450" fill="#8f96a6" text-anchor="start" letter-spacing="0" opacity="1">no Capacitor bridge required</text><circle cx="1146" cy="392" r="4" fill="#8b3bff"><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
