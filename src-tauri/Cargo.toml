[package]
name = "audenic"
version = "2.0.0"
description = "Audenic Music Studio"
authors = ["Mwijay Davie"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
walkdir = "2.5"
rfd = "0.15"
tokio = { version = "1", features = ["process", "sync", "rt-multi-thread"] }
regex = "1.10"
id3 = "1.14"
tauri-plugin-notification = "2"

