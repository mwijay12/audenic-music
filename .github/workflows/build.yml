name: Multi-Platform Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os-name: 'linux'
            args: ''
          - platform: 'windows-latest'
            os-name: 'windows'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # NOTE: no tagName/releaseName here on purpose.
      # If tagName is set, BOTH matrix jobs try to create the same
      # GitHub Release at the same time -> race -> exit code 1 in ~45s.
      # So we only build here, then upload via Artifacts + dedicated Release step.
      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Upload Linux Artifacts (.AppImage, .deb)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: audenic-linux-binaries
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload Windows Artifacts (.exe, .msi)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: audenic-windows-binaries
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # Separate job: runs ONCE (not per-matrix) and only on version tags.
  # Creates the permanent download page Wolfgang will use.
  release:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: audenic-linux-binaries
          path: ./release-assets/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: audenic-windows-binaries
          path: ./release-assets/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux/*
            release-assets/windows/*
          body: 'Automated multi-platform release of Audenic Studio.'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
